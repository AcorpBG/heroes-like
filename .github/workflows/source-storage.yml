name: Source storage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tracked-media:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_source_material_tracking.py
